<!DOCTYPE html>
<html>
<head>
    <title>Smart Doorbell</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .container { max-width: 700px; margin-top: 50px; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .video-feed { border: 5px solid #007bff; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 100%; height: auto; }
        .btn-action { font-weight: 600; padding: 12px 30px; border-radius: 30px; transition: all 0.2s; }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="text-center">
    <div class="container">
        <h1 class="mb-4">🚪 Smart Doorbell System</h1>
        <div class="mb-4">
            <img src="/video_feed" width="640" height="480" class="video-feed" alt="Live Camera Feed">
        </div>
        <div class="d-flex justify-content-center gap-3">
            <a href="/lock" class="btn btn-danger btn-lg btn-action mx-2">Lock Door 🔒</a>
            <a href="/unlock" class="btn btn-success btn-lg btn-action mx-2">Unlock Door 🔓</a>
        </div>
    </div>
</body>
</html>
